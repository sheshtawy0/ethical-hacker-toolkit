<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ Ethical Hacker Toolkit | أدوات الهكر الأخلاقي</title>
<meta name="description" content="مجموعة أدوات الهكر الأخلاقي — فحص المنافذ، WHOIS، DNS، معلومات IP، تحليل الهيدرز، وPing">
<style>
:root {
  --bg: #0a0a0a;
  --bg2: #0f0f0f;
  --bg3: #161616;
  --bg4: #1c1c1c;
  --green: #00ff41;
  --green-dark: #003d0f;
  --green-glow: rgba(0, 255, 65, 0.4);
  --red: #ff3333;
  --yellow: #ffcc00;
  --blue: #00bfff;
  --purple: #b8a9e8;
  --text: #b8b8b8;
  --text-bright: #fff;
  --text-dim: #666;
  --border: #222;
  --border-hover: #333;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  font-family: 'Courier New', 'Consolas', monospace;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  scroll-behavior: smooth;
}

/* Matrix Rain Background */
#matrix-bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  opacity: 0.12;
  pointer-events: none;
}

/* Scanline overlay */
body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(rgba(0, 255, 65, 0.02) 50%, transparent 50%);
  background-size: 100% 4px;
  pointer-events: none;
  z-index: 1;
}

.container {
  position: relative;
  z-index: 2;
  max-width: 1300px;
  margin: 0 auto;
  padding: 20px;
}

/* Header */
.header {
  text-align: center;
  padding: 60px 20px 40px;
  border-bottom: 2px solid var(--green-dark);
  margin-bottom: 40px;
  position: relative;
}

.header::after {
  content: '';
  position: absolute;
  bottom: -2px;
  left: 50%;
  transform: translateX(-50%);
  width: 200px;
  height: 2px;
  background: var(--green);
  box-shadow: 0 0 20px var(--green);
}

.logo {
  font-size: 4em;
  margin-bottom: 15px;
  animation: pulse 2s infinite;
  display: inline-block;
}

@keyframes pulse {
  0%, 100% { opacity: 1; text-shadow: 0 0 20px var(--green), 0 0 40px var(--green); }
  50% { opacity: 0.85; text-shadow: 0 0 40px var(--green), 0 0 80px var(--green); }
}

.header h1 {
  font-size: 2.8em;
  color: var(--green);
  text-shadow: 0 0 20px var(--green-glow);
  letter-spacing: 4px;
  margin: 15px 0;
  font-weight: bold;
}

.subtitle {
  color: var(--text);
  font-size: 1em;
  letter-spacing: 6px;
  opacity: 0.9;
  margin-bottom: 20px;
}

.warning-banner {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  color: var(--red);
  font-size: 0.85em;
  margin-top: 15px;
  padding: 10px 20px;
  border: 1px solid rgba(255, 51, 51, 0.4);
  background: rgba(255, 51, 51, 0.05);
  border-radius: 5px;
}

/* Status Bar */
.status-bar {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-bottom: 40px;
  flex-wrap: wrap;
}

.status-item {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 18px 30px;
  text-align: center;
  min-width: 150px;
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
}

.status-item::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(0, 255, 65, 0.1), transparent);
  transition: left 0.6s;
}

.status-item:hover::before {
  left: 100%;
}

.status-item:hover {
  border-color: var(--green-dark);
  transform: translateY(-3px);
  box-shadow: 0 5px 20px rgba(0, 255, 65, 0.15);
}

.status-dot {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  margin-left: 8px;
  vertical-align: middle;
}

.status-dot.online {
  background: var(--green);
  box-shadow: 0 0 10px var(--green);
  animation: blink-dot 1.5s infinite;
}

@keyframes blink-dot {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.status-value {
  font-size: 1.3em;
  color: var(--text-bright);
  font-weight: bold;
  display: block;
}

/* Live Stats Dashboard */
.live-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 15px;
  margin-bottom: 40px;
}

.stat-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px 22px;
  position: relative;
  overflow: hidden;
  transition: all 0.3s;
}

.stat-card:hover {
  border-color: var(--green-dark);
  transform: translateY(-3px);
  box-shadow: 0 8px 30px rgba(0, 255, 65, 0.1);
}

.stat-card .stat-icon-wrap {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.stat-card .stat-icon {
  font-size: 1.5em;
  filter: drop-shadow(0 0 8px currentColor);
}

.stat-card .stat-live-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  animation: livePulse 2s infinite;
}

.stat-card .stat-live-dot.visits { background: var(--green); box-shadow: 0 0 8px var(--green); }
.stat-card .stat-live-dot.runtime { background: var(--blue); box-shadow: 0 0 10px var(--blue); }
.stat-card .stat-live-dot.tools { background: var(--purple); box-shadow: 0 0 8px var(--purple); }
.stat-card .stat-live-dot.session { background: var(--yellow); box-shadow: 0 0 8px var(--yellow); }
.stat-card .stat-live-dot.scans { background: #ff6b6b; box-shadow: 0 0 8px #ff6b6b; }
.stat-card .stat-live-dot.last { background: #f0f; box-shadow: 0 0 10px #f0f; }

@keyframes livePulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(1.6); }
}

.stat-card .stat-number {
  font-size: 2.2em;
  font-weight: bold;
  color: var(--text-bright);
  line-height: 1.2;
  font-family: 'Courier New', monospace;
  transition: all 0.3s;
}

.stat-card:hover .stat-number {
  text-shadow: 0 0 20px currentColor;
}

.stat-card .stat-label {
  font-size: 0.72em;
  color: var(--text-dim);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-top: 2px;
}

.stat-card .stat-sub {
  font-size: 0.65em;
  color: var(--text-dim);
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid rgba(255,255,255,0.05);
  opacity: 0.7;
}

.stat-card .stat-bar {
  margin-top: 10px;
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}

.stat-card .stat-bar-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
}

.stat-card .stat-bar-fill.visits { background: linear-gradient(90deg, var(--green-dark), var(--green)); }
.stat-card .stat-bar-fill.runtime { background: linear-gradient(90deg, rgba(0,191,255,0.3), var(--blue)); }
.stat-card .stat-bar-fill.tools { background: linear-gradient(90deg, rgba(184,169,232,0.3), var(--purple)); }
.stat-card .stat-bar-fill.session { background: linear-gradient(90deg, rgba(255,204,0,0.3), var(--yellow)); }
.stat-card .stat-bar-fill.scans { background: linear-gradient(90deg, rgba(255,107,107,0.3), #ff6b6b); }
.stat-card .stat-bar-fill.last { background: linear-gradient(90deg, rgba(255,0,255,0.3), #f0f); }

.stat-number.flash {
  animation: numFlash 0.5s ease-out;
}

@keyframes numFlash {
  0% { transform: scale(1.3); color: var(--green); }
  100% { transform: scale(1); color: var(--text-bright); }
}

/* Live Stats responsive */
@media (max-width: 768px) {
  .live-stats {
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .stat-card {
    padding: 14px 16px;
  }
  .stat-card .stat-number {
    font-size: 1.5em;
  }
}

/* Section Titles */
.section-title {
  color: var(--green);
  font-size: 1.5em;
  margin-bottom: 25px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
  letter-spacing: 3px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.section-title::before {
  content: '▸';
  color: var(--green);
  animation: blink 1.5s infinite;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

/* Tools Grid */
.tools-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
  gap: 20px;
  margin-bottom: 50px;
}

.tool-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  cursor: pointer;
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
}

.tool-card::before {
  content: '';
  position: absolute;
  top: 0;
  right: 0;
  width: 4px;
  height: 100%;
  background: var(--green);
  transform: scaleY(0);
  transform-origin: top;
  transition: transform 0.3s;
}

.tool-card:hover {
  border-color: var(--green-dark);
  box-shadow: 0 10px 30px rgba(0, 255, 65, 0.15);
  transform: translateY(-4px);
}

.tool-card:hover::before {
  transform: scaleY(1);
}

.tool-card.active {
  border-color: var(--green);
  box-shadow: 0 0 30px rgba(0, 255, 65, 0.25);
}

.tool-card.active::before {
  transform: scaleY(1);
}

.tool-badge {
  position: absolute;
  top: 15px;
  left: 15px;
  font-size: 0.7em;
  padding: 3px 8px;
  border-radius: 4px;
  letter-spacing: 1px;
  font-weight: bold;
}

.tool-badge.live {
  background: rgba(0, 255, 65, 0.15);
  color: var(--green);
  border: 1px solid rgba(0, 255, 65, 0.3);
}

.tool-badge.demo {
  background: rgba(255, 204, 0, 0.15);
  color: var(--yellow);
  border: 1px solid rgba(255, 20
